<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>เว็บไซต์กำลังอัปเดตข้อมูล | Police Innovation Contest 2026</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #061428;
      --panel: rgba(7, 20, 42, 0.88);
      --line: rgba(216, 182, 47, 0.45);
      --gold: #e5c12f;
      --gold-soft: #fff0a8;
      --muted: #c2cad8;
      --cyan: #5bdcc4;
      --ink: #f6f8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 8%, rgba(75, 143, 213, 0.28), transparent 34%),
        linear-gradient(rgba(45, 106, 170, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45, 106, 170, 0.15) 1px, transparent 1px),
        var(--navy);
      background-size: auto, 132px 132px, 132px 132px, auto;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: auto -12vw -32vh;
      height: 55vh;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(10, 125, 196, 0.32), transparent 68%);
      filter: blur(12px);
    }

    main {
      width: min(760px, 100%);
      position: relative;
      padding: clamp(26px, 5vw, 54px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 86% 12%, rgba(91, 220, 196, 0.13), transparent 30%),
        linear-gradient(145deg, rgba(20, 35, 59, 0.94), rgba(2, 10, 24, 0.94)),
        var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
      color: var(--gold-soft);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(91, 220, 196, 0.35);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(11, 35, 69, 0.92), rgba(2, 10, 24, 0.92));
      color: var(--gold-soft);
      font-size: 36px;
      line-height: 1;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 14px;
      border: 1px solid rgba(216, 182, 47, 0.5);
      border-radius: 999px;
      color: var(--gold);
      background: rgba(216, 182, 47, 0.12);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 0 0 rgba(91, 220, 196, 0.65);
      animation: pulse 1.8s ease-out infinite;
    }

    h1 {
      margin: 20px 0 10px;
      color: var(--gold-soft);
      font-size: clamp(30px, 6vw, 54px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    p {
      max-width: 580px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(16px, 2.3vw, 20px);
      line-height: 1.75;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    button,
    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      border: 0;
      color: #061428;
      background: linear-gradient(180deg, #ffe36f, #d8b62f);
      box-shadow: 0 14px 32px rgba(216, 182, 47, 0.2);
    }

    a {
      border: 1px solid rgba(216, 182, 47, 0.45);
      color: var(--gold-soft);
      background: rgba(1, 8, 22, 0.48);
    }

    small {
      display: block;
      margin-top: 20px;
      color: rgba(194, 202, 216, 0.82);
      font-size: 13px;
      line-height: 1.6;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(91, 220, 196, 0.58); }
      70% { box-shadow: 0 0 0 12px rgba(91, 220, 196, 0); }
      100% { box-shadow: 0 0 0 0 rgba(91, 220, 196, 0); }
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }

      main {
        border-radius: 18px;
      }

      .brand {
        flex-direction: column;
        gap: 8px;
      }

      .actions {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Police Innovation Contest 2026</span>
    </div>
    <div class="status"><span class="pulse"></span>System Updating</div>
    <h1>เว็บไซต์กำลังอัปเดตข้อมูล</h1>
    <p>กรุณา refresh หน้าจออีกครั้ง หากยังเข้าไม่ได้ อาจเป็นช่วงที่ระบบกำลังปรับปรุงหลัง deploy โปรดลองใหม่อีกครั้งในไม่กี่วินาที</p>
    <div class="actions">
      <button type="button" onclick="window.location.reload()">Refresh หน้าจอ</button>
      <a href="/">กลับหน้าแรก</a>
    </div>
    <small>ระบบกำลังโหลดเวอร์ชันล่าสุดของเว็บไซต์ให้พร้อมใช้งาน</small>
  </main>
</body>
</html>
