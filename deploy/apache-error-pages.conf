# Include this snippet inside the Apache VirtualHost for innocontest.police.go.th.
# It replaces Apache's default white "Service Unavailable" page while the
# Next.js container is restarting during deployment.
#
# The 503 page must be served directly by Apache. Include this before the
# catch-all ProxyPass rule so /503.html is not forwarded to the Next.js app.

ProxyErrorOverride On
ProxyPass "/503.html" "!"
ErrorDocument 502 /503.html
ErrorDocument 503 /503.html
ErrorDocument 504 /503.html

Alias "/503.html" "/var/www/contest-portal/current/public/503.html"

<Location "/503.html">
  Require all granted
  <IfModule mod_headers.c>
    Header always set Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate"
  </IfModule>
</Location>
