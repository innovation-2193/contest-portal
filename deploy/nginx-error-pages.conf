# Include this snippet inside the HTTPS server block for innocontest.police.go.th.
# It replaces the default "Service Unavailable" page while the Next.js container
# is restarting during deployment.
#
# The 503 page must be served directly by nginx. Do not proxy /503.html back to
# the Next.js app, because the app may be unavailable at the exact moment this
# page is needed.

proxy_intercept_errors on;
error_page 502 503 504 /503.html;

location = /503.html {
  root /var/www/contest-portal/current/public;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
}
