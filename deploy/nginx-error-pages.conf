# Include this snippet inside the HTTPS server block for innocontest.police.go.th.
# It replaces the default "Service Unavailable" page while Next.js is restarting
# during deployment.

proxy_intercept_errors on;
error_page 502 503 504 /503.html;

location = /503.html {
  root /var/www/contest-portal/current/public;
  internal;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
}
